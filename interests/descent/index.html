<!DOCTYPE html>
<html lang="en">
<head>
<title>Descent — Hao Xiao</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Descent: a neural network trained live in the browser to reproduce whatever is drawn on the screen, shown in three dimensions." />
<link rel="canonical" href="https://xiao98.github.io/interests/descent/" />
<style>
	html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #fff; font: 10px/1.5 ui-monospace, Consolas, Menlo, monospace; letter-spacing: .08em; }
	#scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
	.layer { position: fixed; pointer-events: none; text-transform: uppercase; }
	#head { left: 22px; top: 18px; }
	#head h1 { margin: 0 0 4px; font: inherit; font-size: 13px; letter-spacing: .3em; }
	#head p { margin: 0; opacity: .6; }
	#stats { margin-top: 10px !important; opacity: 1 !important; white-space: pre; }
	#feed { right: 22px; top: 18px; margin: 0; text-align: right; white-space: pre; opacity: .7; font: inherit; font-size: 9px; }
	#curve { right: 22px; bottom: 74px; width: 200px; height: 40px; opacity: .9; }
	#bars { left: 0; right: 0; bottom: 0; width: 100%; height: 44px; image-rendering: pixelated; }
	#tools { left: 22px; bottom: 66px; pointer-events: auto; }
	#pad { display: block; width: 132px; height: 132px; border: 1px solid rgba(255,255,255,.45); image-rendering: pixelated; cursor: crosshair; touch-action: none; background: #000; }
	#tools div { margin-top: 8px; display: flex; gap: 14px; }
	button, #tools a { background: none; border: 0; padding: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; color: #fff; opacity: .65; cursor: pointer; text-decoration: none; }
	button:hover, button:focus-visible, #tools a:hover, #tools a:focus-visible { opacity: 1; outline: none; text-decoration: underline; }
	#fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 2em; }
	@media (max-width: 720px) { #feed, #curve { display: none; } #pad { width: 104px; height: 104px; } }
</style>
</head>
<body>
<canvas id="scene" aria-label="A neural network in three dimensions, learning live to reproduce a drawing"></canvas>

<div class="layer" id="head">
	<h1>Descent</h1>
	<p>A neural network learning a drawing, live<br />Behind it, what it drew before</p>
	<p id="stats"></p>
</div>
<pre class="layer" id="feed" aria-hidden="true"></pre>
<canvas class="layer" id="curve" width="400" height="80" aria-hidden="true"></canvas>
<canvas class="layer" id="bars" width="1024" height="1" aria-hidden="true"></canvas>
<div class="layer" id="tools">
	<canvas id="pad" width="64" height="64" aria-label="Draw here"></canvas>
	<div><button id="clear" type="button">Clear</button><button id="reset" type="button">Reset network</button><a href="/interests/">Hao Xiao</a></div>
</div>
<p id="fallback">This piece needs WebGL, which this browser does not provide.</p>

<script type="importmap">
{ "imports": {
	"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
	"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
/*
	Descent.
	A multilayer perceptron is trained in this page, by gradient descent, to reproduce the drawing in the
	small square: it maps a position (x, y) to the brightness of the drawing there. Nothing is decorative:
	every line is a weight, every point a neuron or a pixel, every number a live value.

	From one end to the other: the drawing (64 x 64 points), 18 input features (ring), three layers of
	64 neurons, one output neuron, what the network currently draws (64 x 64 points), and behind it
	what it drew before: time is the last stretch of the same axis.
	Cyan is positive, magenta negative. A line glows by |weight x activation| for the probed position.
*/
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---- Network: (x, y) -> Fourier features -> 3 hidden layers of tanh -> 1 sigmoid output.
const FREQS = [1, 2, 4, 8];
const SIZES = [2 + 4 * FREQS.length, 64, 64, 64, 1];
const L = SIZES.length - 1;
const N = 64;				// the drawing is N x N
const BATCH = 48, STEPS_PER_FRAME = 3, RATE = 0.006;

let W, B, mW, vW, mB, vB, gW, gB, act, delta, step, loss, history, params;

function reset() {
	W = []; B = []; mW = []; vW = []; mB = []; vB = []; gW = []; gB = []; params = 0;
	for (let l = 0; l < L; l++) {
		const nIn = SIZES[l], nOut = SIZES[l + 1], range = Math.sqrt(6 / (nIn + nOut));
		const w = new Float32Array(nIn * nOut);
		for (let i = 0; i < w.length; i++) w[i] = (Math.random() * 2 - 1) * range;
		W.push(w); B.push(new Float32Array(nOut));
		mW.push(new Float32Array(w.length)); vW.push(new Float32Array(w.length)); gW.push(new Float32Array(w.length));
		mB.push(new Float32Array(nOut)); vB.push(new Float32Array(nOut)); gB.push(new Float32Array(nOut));
		params += w.length + nOut;
	}
	act = SIZES.map(n => new Float32Array(n));
	delta = SIZES.map(n => new Float32Array(n));
	step = 0; loss = 0.69; history = [];
}

// Forward pass for the position (x, y), both in [-1, 1]. Activations stay in act.
function forward(x, y) {
	const a = act[0];
	let k = 2;
	a[0] = x; a[1] = y;
	for (const f of FREQS) {
		const p = f * Math.PI;
		a[k++] = Math.sin(p * x); a[k++] = Math.cos(p * x);
		a[k++] = Math.sin(p * y); a[k++] = Math.cos(p * y);
	}
	for (let l = 0; l < L; l++) {
		const nIn = SIZES[l], nOut = SIZES[l + 1], w = W[l], b = B[l], from = act[l], to = act[l + 1];
		for (let j = 0; j < nOut; j++) {
			let z = b[j];
			const o = j * nIn;
			for (let i = 0; i < nIn; i++) z += w[o + i] * from[i];
			to[j] = l < L - 1 ? Math.tanh(z) : 1 / (1 + Math.exp(-z));
		}
	}
	return act[L][0];
}

// One step of gradient descent (Adam) on a random batch of positions of the drawing.
function train() {
	let total = 0;
	for (let l = 0; l < L; l++) { gW[l].fill(0); gB[l].fill(0); }

	for (let s = 0; s < BATCH; s++) {
		const px = Math.random() * N | 0, py = Math.random() * N | 0, t = target[py * N + px];
		const p = forward(px / (N - 1) * 2 - 1, py / (N - 1) * 2 - 1);
		total -= t * Math.log(p + 1e-7) + (1 - t) * Math.log(1 - p + 1e-7);

		delta[L][0] = p - t;
		for (let l = L - 1; l >= 0; l--) {
			const nIn = SIZES[l], nOut = SIZES[l + 1], w = W[l], g = gW[l], from = act[l], d = delta[l + 1], dPrev = delta[l];
			if (l > 0) dPrev.fill(0);
			for (let j = 0; j < nOut; j++) {
				const dj = d[j], o = j * nIn;
				gB[l][j] += dj;
				for (let i = 0; i < nIn; i++) {
					g[o + i] += dj * from[i];
					if (l > 0) dPrev[i] += w[o + i] * dj;
				}
			}
			if (l > 0) for (let i = 0; i < nIn; i++) dPrev[i] *= 1 - from[i] * from[i];
		}
	}

	step++;
	const c1 = 1 - Math.pow(0.9, step), c2 = 1 - Math.pow(0.999, step);
	const update = (x, g, m, v) => {
		for (let k = 0; k < x.length; k++) {
			const gk = g[k] / BATCH;
			m[k] = 0.9 * m[k] + 0.1 * gk;
			v[k] = 0.999 * v[k] + 0.001 * gk * gk;
			x[k] -= RATE * (m[k] / c1) / (Math.sqrt(v[k] / c2) + 1e-8);
		}
	};
	for (let l = 0; l < L; l++) { update(W[l], gW[l], mW[l], vW[l]); update(B[l], gB[l], mB[l], vB[l]); }
	loss = 0.98 * loss + 0.02 * total / BATCH;
}

// ---- The drawing.
const pad = document.getElementById('pad'), padCtx = pad.getContext('2d', { willReadFrequently: true });
const target = new Float32Array(N * N), output = new Float32Array(N * N);

function readTarget() {
	const data = padCtx.getImageData(0, 0, N, N).data;
	for (let i = 0; i < N * N; i++) target[i] = data[i * 4] / 255;
}
function clearPad() { padCtx.fillStyle = '#000'; padCtx.fillRect(0, 0, N, N); readTarget(); }
function stroke(x0, y0, x1, y1) {
	padCtx.strokeStyle = '#fff'; padCtx.lineWidth = 3.5; padCtx.lineCap = 'round';
	padCtx.beginPath(); padCtx.moveTo(x0, y0); padCtx.lineTo(x1, y1); padCtx.stroke();
	readTarget();
}
clearPad();
for (let a = 0.1, x0 = N / 2, y0 = N / 2; a < 15; a += 0.1) {		// starting drawing: a spiral
	const x = N / 2 + 1.8 * a * Math.cos(a), y = N / 2 + 1.8 * a * Math.sin(a);
	stroke(x0, y0, x, y); x0 = x; y0 = y;
}

let last = null;
const toPad = event => {
	const r = pad.getBoundingClientRect();
	return [(event.clientX - r.left) / r.width * N, (event.clientY - r.top) / r.height * N];
};
pad.addEventListener('pointerdown', event => { last = toPad(event); stroke(last[0], last[1], last[0], last[1]); pad.setPointerCapture(event.pointerId); });
pad.addEventListener('pointermove', event => { if (!last) return; const p = toPad(event); stroke(last[0], last[1], p[0], p[1]); last = p; });
pad.addEventListener('pointerup', () => { last = null; });
pad.addEventListener('pointercancel', () => { last = null; });
document.getElementById('clear').addEventListener('click', clearPad);
document.getElementById('reset').addEventListener('click', reset);

reset();

// ---- Scene.
const canvas = document.getElementById('scene');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (error) { document.getElementById('fallback').style.display = 'flex'; throw error; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.enablePan = false;
controls.autoRotate = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 8; controls.maxDistance = 160;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.5, 0.45, 0.35);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const POSITIVE = [0.15, 0.8, 1.0], NEGATIVE = [1.0, 0.15, 0.55];

// Where everything is. The network runs along the x axis.
const PLANE = 6, X_IN = -12.5, X_OUT = 12.5, X = [-8, -4.2, 0, 4.2, 8];
const nodes = SIZES.map((n, l) => {
	const p = new Float32Array(n * 3);
	for (let i = 0; i < n; i++) {
		let y = 0, z = 0;
		if (l == 0) { const a = i / n * Math.PI * 2; y = 2.1 * Math.cos(a); z = 2.1 * Math.sin(a); }
		else if (n > 1) { y = ((i >> 3) - 3.5) * 0.8; z = ((i & 7) - 3.5) * 0.8; }
		p[i * 3] = X[l]; p[i * 3 + 1] = y; p[i * 3 + 2] = z;
	}
	return p;
});
const pixel = (x, px, py, out, o) => {
	out[o] = x; out[o + 1] = (0.5 - py / (N - 1)) * PLANE; out[o + 2] = (px / (N - 1) - 0.5) * PLANE;
};

// Points (pixels, neurons, particles): soft discs, additive.
const pointMaterial = new THREE.ShaderMaterial({
	uniforms: { scale: { value: 1 } },
	vertexShader: 'attribute float size; attribute vec3 tint; varying vec3 vTint; uniform float scale;' +
		'void main() { vTint = tint; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = size * scale / -mv.z; gl_Position = projectionMatrix * mv; }',
	fragmentShader: 'varying vec3 vTint; void main() { float d = length(gl_PointCoord - 0.5); gl_FragColor = vec4(vTint * smoothstep(0.5, 0.08, d), 1.0); }',
	blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, transparent: true
});
function points(count, size, material = pointMaterial) {
	const geometry = new THREE.BufferGeometry();
	geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
	geometry.setAttribute('tint', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
	geometry.setAttribute('size', new THREE.BufferAttribute(new Float32Array(count).fill(size), 1));
	const object = new THREE.Points(geometry, material);
	object.frustumCulled = false;
	scene.add(object);
	return { position: geometry.attributes.position, tint: geometry.attributes.tint, size: geometry.attributes.size };
}
function lines(count, opacity) {
	const geometry = new THREE.BufferGeometry();
	geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count * 6), 3));
	geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(count * 6), 3));
	const object = new THREE.LineSegments(geometry, new THREE.LineBasicMaterial({
		vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, transparent: true, opacity
	}));
	object.frustumCulled = false;
	scene.add(object);
	return { position: geometry.attributes.position, color: geometry.attributes.color };
}

// The two planes of pixels.
const inPlane = points(N * N, 0.06), outPlane = points(N * N, 0.06);
for (let py = 0; py < N; py++) for (let px = 0; px < N; px++) {
	pixel(X_IN, px, py, inPlane.position.array, (py * N + px) * 3);
	pixel(X_OUT, px, py, outPlane.position.array, (py * N + px) * 3);
}

// Time: what the network drew before stays behind the output plane, one layer per moment, the most
// recent nearest. White is what was there; cyan what was appearing, magenta what was disappearing.
const LAYERS = 64, GAP = 0.22, EVERY = 12;
const trailMaterial = new THREE.ShaderMaterial({
	uniforms: { scale: pointMaterial.uniforms.scale, start: { value: X_OUT }, depth: { value: LAYERS * GAP } },
	vertexShader: 'attribute float size; attribute vec3 tint; varying vec3 vTint; uniform float scale, start, depth;' +
		'void main() { float age = (position.x - start) / depth; vTint = tint * pow(1.0 - age, 1.5);' +
		'vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = size * scale / -mv.z; gl_Position = projectionMatrix * mv; }',
	fragmentShader: pointMaterial.fragmentShader,
	blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, transparent: true
});
const trail = points(LAYERS * N * N, 0.06, trailMaterial), before = new Float32Array(N * N);
for (let s = 0; s < LAYERS; s++) for (let py = 0; py < N; py++) for (let px = 0; px < N; px++)
	pixel(X_OUT + GAP * (s + 1), px, py, trail.position.array, ((s * N + py) * N + px) * 3);

function remember() {
	const tint = trail.tint.array;
	tint.copyWithin(N * N * 3, 0, (LAYERS - 1) * N * N * 3);
	for (let i = 0; i < N * N; i++) {
		const v = output[i], d = v - before[i], m = Math.min(1, Math.abs(d) * 5), c = d > 0 ? POSITIVE : NEGATIVE;
		const white = v * v * 0.3 * (1 - m), k = m * 0.7;
		tint[i * 3] = white + c[0] * k; tint[i * 3 + 1] = white + c[1] * k; tint[i * 3 + 2] = white + c[2] * k;
		before[i] = v;
	}
	trail.tint.needsUpdate = true;
}

// Neurons.
const neuronCount = SIZES.reduce((a, b) => a + b, 0), neurons = points(neuronCount, 0.2);
{ let o = 0; for (let l = 0; l <= L; l++) { neurons.position.array.set(nodes[l], o); o += nodes[l].length; } }

// Weights: one line each.
let edgeCount = 0; for (let l = 0; l < L; l++) edgeCount += W[l].length;
const edges = lines(edgeCount, 0.3);
{
	let o = 0;
	for (let l = 0; l < L; l++) for (let j = 0; j < SIZES[l + 1]; j++) for (let i = 0; i < SIZES[l]; i++) {
		edges.position.array.set(nodes[l].subarray(i * 3, i * 3 + 3), o);
		edges.position.array.set(nodes[l + 1].subarray(j * 3, j * 3 + 3), o + 3);
		o += 6;
	}
}

// The probe: a fan from one pixel of the drawing to the input ring, and a line from the output neuron
// to the same pixel of the output plane.
const fan = lines(SIZES[0] + 1, 0.7), probe = points(2, 0.25);

// Particles travelling along the connections that carry the most signal.
const PARTICLES = 2600, particles = points(PARTICLES, 0.06);
const pLayer = new Uint8Array(PARTICLES), pFrom = new Uint8Array(PARTICLES), pTo = new Uint8Array(PARTICLES);
const pTime = new Float32Array(PARTICLES).map(() => Math.random()), pSpeed = new Float32Array(PARTICLES);
function spawn(k) {
	let best = -1;
	for (let tries = 0; tries < 5; tries++) {
		const l = Math.random() * L | 0, i = Math.random() * SIZES[l] | 0, j = Math.random() * SIZES[l + 1] | 0;
		const signal = Math.abs(W[l][j * SIZES[l] + i] * act[l][i]);
		if (signal > best) { best = signal; pLayer[k] = l; pFrom[k] = i; pTo[k] = j; }
	}
	pTime[k] = 0; pSpeed[k] = 0.006 + Math.random() * 0.014;
}
for (let k = 0; k < PARTICLES; k++) { spawn(k); pTime[k] = Math.random(); }

function resize() {
	const w = window.innerWidth, h = window.innerHeight;
	renderer.setSize(w, h, false); composer.setSize(w, h); bloom.setSize(w, h);
	camera.aspect = w / h; camera.updateProjectionMatrix();
	pointMaterial.uniforms.scale.value = h * renderer.getPixelRatio() * 1.25;
	const distance = 40 / Math.min(1, camera.aspect / 1.55);
	camera.position.sub(controls.target).setLength(distance).add(controls.target);
}
controls.target.set(7, 0, 0);
camera.position.set(-6, 8, 26);
window.addEventListener('resize', resize);
resize();

// ---- Data layer.
const stats = document.getElementById('stats'), feed = document.getElementById('feed'), feedLines = [];
const curve = document.getElementById('curve').getContext('2d');
const bars = document.getElementById('bars').getContext('2d'), barImage = bars.createImageData(1024, 1);
const pad2 = n => String(n).padStart(2, '0');

function dataLayer(frame) {
	if (frame % 6 == 0) {
		stats.textContent = 'step ' + String(step).padStart(7, '0') + '\nloss ' + loss.toFixed(5) + '\n' + params + ' parameters';

		// One more live weight, with its last gradient.
		const l = 1 + (Math.random() * 2 | 0), i = Math.random() * 64 | 0, j = Math.random() * 64 | 0, k = j * 64 + i;
		const w = W[l][k], g = gW[l][k] / BATCH;
		feedLines.push('L' + l + ' ' + pad2(i) + '>' + pad2(j) + '  w ' + (w < 0 ? '' : '+') + w.toFixed(5) + '  dw ' + (g < 0 ? '' : '+') + g.toExponential(2));
		if (feedLines.length > 16) feedLines.shift();
		feed.textContent = feedLines.join('\n');

		// Barcode: one bar per weight of the middle layer.
		const data = barImage.data, weights = W[1];
		for (let x = 0; x < 1024; x++) {
			const v = weights[x * 4], c = v > 0 ? Math.min(255, v * 900) : 0;
			data[x * 4] = data[x * 4 + 1] = data[x * 4 + 2] = c; data[x * 4 + 3] = 255;
		}
		bars.putImageData(barImage, 0, 0);
	}
	if (frame % 12 == 0) {
		history.push(loss); if (history.length > 200) history.shift();
		curve.clearRect(0, 0, 400, 80);
		curve.strokeStyle = '#fff'; curve.lineWidth = 1.5; curve.beginPath();
		history.forEach((v, i) => curve.lineTo(400 * i / 199, 78 - 76 * Math.min(1, v / 0.7)));
		curve.stroke();
	}
}

// ---- Loop.
let frame = 0, scan = 0;
const tmp = new Float32Array(3);

function tick(time) {
	for (let s = 0; s < STEPS_PER_FRAME; s++) train();

	// Output plane: a few rows per frame, top to bottom, again and again.
	for (let r = 0; r < 4; r++) {
		for (let x = 0; x < N; x++) output[scan * N + x] = forward(x / (N - 1) * 2 - 1, scan / (N - 1) * 2 - 1);
		scan = (scan + 1) % N;
	}
	const inTint = inPlane.tint.array, outTint = outPlane.tint.array;
	for (let i = 0; i < N * N; i++) {
		const a = 0.04 + 0.5 * target[i], row = (i / N | 0);
		const b = 0.04 + 0.5 * output[i] + (row == scan ? 0.2 : 0);
		inTint[i * 3] = inTint[i * 3 + 1] = inTint[i * 3 + 2] = a;
		outTint[i * 3] = b * 0.75; outTint[i * 3 + 1] = b * 0.95; outTint[i * 3 + 2] = b;
	}
	inPlane.tint.needsUpdate = outPlane.tint.needsUpdate = true;
	if (frame % EVERY == 0) remember();

	// Probe: glides over the drawing.
	const t = time * 0.001;
	const qx = Math.sin(t * 0.83) * 0.92, qy = Math.sin(t * 1.27 + 1) * 0.92;
	const value = forward(qx, qy);
	const px = (qx + 1) / 2 * (N - 1), py = (qy + 1) / 2 * (N - 1);

	// Neurons: size and colour by activation.
	{
		let o = 0;
		for (let l = 0; l <= L; l++) for (let i = 0; i < SIZES[l]; i++, o++) {
			const a = act[l][i], s = Math.min(1, Math.abs(a)), c = l == L ? [1, 1, 1] : a > 0 ? POSITIVE : NEGATIVE, k = 0.12 + 0.6 * s;
			neurons.size.array[o] = l == L ? 0.3 + 0.3 * a : 0.08 + 0.2 * s;
			neurons.tint.array[o * 3] = c[0] * k; neurons.tint.array[o * 3 + 1] = c[1] * k; neurons.tint.array[o * 3 + 2] = c[2] * k;
		}
		neurons.size.needsUpdate = neurons.tint.needsUpdate = true;
	}

	// Weights: glow by |weight x activation| for the probed position.
	{
		const color = edges.color.array;
		let o = 0;
		for (let l = 0; l < L; l++) {
			const nIn = SIZES[l], nOut = SIZES[l + 1], w = W[l], from = act[l], gain = l == L - 1 ? 0.8 : 1.3;
			for (let j = 0; j < nOut; j++) for (let i = 0; i < nIn; i++, o += 6) {
				const wv = w[j * nIn + i], signal = wv * from[i], m = Math.min(1, Math.abs(signal) * gain);
				const k = m * m * m * 0.9 + Math.min(0.02, Math.abs(wv) * 0.012), c = signal > 0 ? POSITIVE : NEGATIVE;
				color[o] = c[0] * k * 0.35; color[o + 1] = c[1] * k * 0.35; color[o + 2] = c[2] * k * 0.35;
				color[o + 3] = c[0] * k; color[o + 4] = c[1] * k; color[o + 5] = c[2] * k;
			}
		}
		edges.color.needsUpdate = true;
	}

	// Fan and probe points.
	{
		const p = fan.position.array, c = fan.color.array;
		pixel(X_IN, px, py, tmp, 0);
		for (let i = 0; i < SIZES[0]; i++) {
			p.set(tmp, i * 6); p.set(nodes[0].subarray(i * 3, i * 3 + 3), i * 6 + 3);
			const k = 0.12 + 0.5 * Math.abs(act[0][i]);
			c.fill(k, i * 6, i * 6 + 6);
		}
		probe.position.array.set(tmp, 0);
		const o = SIZES[0] * 6;
		p.set(nodes[L].subarray(0, 3), o);
		pixel(X_OUT, px, py, tmp, 0);
		p.set(tmp, o + 3); c.fill(0.25 + 0.75 * value, o, o + 6);
		probe.position.array.set(tmp, 3);
		probe.tint.array.fill(1, 0, 3); probe.tint.array.fill(0.2 + 0.8 * value, 3, 6);
		fan.position.needsUpdate = fan.color.needsUpdate = probe.position.needsUpdate = probe.tint.needsUpdate = true;
	}

	// Particles.
	{
		const p = particles.position.array, c = particles.tint.array;
		for (let k = 0; k < PARTICLES; k++) {
			pTime[k] += pSpeed[k];
			if (pTime[k] >= 1) spawn(k);
			const l = pLayer[k], a = nodes[l], b = nodes[l + 1], i = pFrom[k] * 3, j = pTo[k] * 3, u = pTime[k];
			p[k * 3] = a[i] + (b[j] - a[i]) * u; p[k * 3 + 1] = a[i + 1] + (b[j + 1] - a[i + 1]) * u; p[k * 3 + 2] = a[i + 2] + (b[j + 2] - a[i + 2]) * u;
			const col = W[l][pTo[k] * SIZES[l] + pFrom[k]] > 0 ? POSITIVE : NEGATIVE, fade = Math.sin(u * Math.PI) * 0.5;
			c[k * 3] = col[0] * fade; c[k * 3 + 1] = col[1] * fade; c[k * 3 + 2] = col[2] * fade;
		}
		particles.position.needsUpdate = particles.tint.needsUpdate = true;
	}

	dataLayer(frame);
	controls.update();
	composer.render();
	frame++;
	requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
